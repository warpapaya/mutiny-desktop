# Electron desktop app is deprecated.
# Mutiny has moved to native iOS/macOS (SwiftUI).
# Validate changes to the deprecated client on pull requests, without restoring
# continuous branch builds or automatic releases.

name: Build (Electron — deprecated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "forge.config.ts"
      - "tsconfig.json"
      - ".eslintrc.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run package
