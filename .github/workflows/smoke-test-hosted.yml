name: Hosted App Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run hosted app smoke test
        run: node scripts/smoke-test-hosted-app.mjs
